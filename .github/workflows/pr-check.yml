name: PR 快速检查

# 🍎 macOS x86 (Intel) 专用应用
# 注意：PR 快速检查只进行静态代码分析（可以在 Ubuntu 上运行）
#      完整测试会在合并后的 CI 流程中在 macOS x86 环境进行

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 只允许一个 workflow 运行在同一个 PR 上
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: 快速代码检查
    runs-on: ubuntu-latest  # 静态代码检查可以在任何平台上运行

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 安装检查工具
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.12.9

    - name: 🔍 Ruff 快速检查
      run: |
        echo "运行 Ruff 代码检查..."
        ruff check plookingII/ --output-format=github --config .ruff.toml

    - name: 🔍 Ruff 格式检查
      run: |
        echo "检查代码格式..."
        ruff format --check plookingII/ --config .ruff.toml

    - name: 📝 检查结果
      if: always()
      run: |
        echo "✅ PR 快速检查完成"

  pr-info:
    name: PR 信息
    runs-on: ubuntu-latest
    steps:
    - name: 显示 PR 信息
      run: |
        echo "================================================"
        echo "🍎 PlookingII PR 快速检查 (macOS x86 专用应用)"
        echo "================================================"
        echo "PR #${{ github.event.pull_request.number }}"
        echo "标题: ${{ github.event.pull_request.title }}"
        echo "作者: ${{ github.event.pull_request.user.login }}"
        echo "分支: ${{ github.event.pull_request.head.ref }}"
        echo "目标: ${{ github.event.pull_request.base.ref }}"
        echo "================================================"
        echo "注意: 完整测试需要在 macOS x86 环境中进行"
        echo "      PR 合并后会触发完整的 CI 流程"
        echo "================================================"
